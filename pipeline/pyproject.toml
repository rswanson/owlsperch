[project]
name = "owlsperch"
version = "0.1.0"
description = "D&D 3.5e reference-data pipeline"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.scripts]
owlsperch = "owlsperch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["owlsperch"]

# All tool configuration ([tool.pytest.ini_options], [tool.ruff], [tool.mypy])
# lives in the root pyproject.toml, not here -- see the comment there. This
# file is the package definition only.
[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]
