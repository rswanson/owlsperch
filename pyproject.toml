# Root of the uv workspace.
#
# This file has no [project] table on purpose: it is a "virtual" workspace
# root whose only job is to declare `pipeline` as a workspace member so that
# `uv run owlsperch ...` works from the repo root (uv shares one lockfile and
# virtual environment across all workspace members, and installs each
# member's console-script entry points into it). See pipeline/pyproject.toml
# for the actual `owlsperch` package and its dependencies.
[tool.uv.workspace]
members = ["pipeline"]

# This root pyproject.toml is the single source of truth for all tool
# configuration (pytest, ruff, mypy). pipeline/pyproject.toml holds only the
# package definition (project metadata, build system, console script, dev
# dependency group) and no [tool.*] sections of its own.
#
# This matters in practice for mypy: mypy's config discovery only checks the
# current *working directory* for a pyproject.toml (unlike ruff, which walks
# up the tree). Since every documented command (`uv run mypy pipeline`, CI,
# README, CLAUDE.md) is invoked from the repo root, a [tool.mypy] section in
# pipeline/pyproject.toml would be silently ignored -- mypy would fall back
# to non-strict defaults with no warning. Keeping the config here instead
# means the documented command actually enforces strict mode.
[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
markers = [
    "corpus: requires the real PDF corpus ($OWLSPERCH_PDFS or ~/D_D) to be present on disk; skipped otherwise",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Ruff's default first-party source roots are [<this file's dir>, <this file's
# dir>/src]; since this config now lives at the repo root but the actual
# `owlsperch` package lives under pipeline/, it must be pointed at pipeline/
# explicitly so `owlsperch` imports are still classified as first-party by
# the isort rules (I001) rather than third-party.
src = ["pipeline"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["pipeline/owlsperch", "pipeline/tests"]
