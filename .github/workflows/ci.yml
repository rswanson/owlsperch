name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy pipeline server

      - name: pytest
        run: uv run pytest pipeline/tests server/tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The web app's e2e smoke test starts its own backend via `uv run
      # python e2e/serve-fixture.py` (owlsperch.fixture_db + owlsperch_server),
      # so this job needs the Python workspace installed too, not just node.
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: eslint
        working-directory: web
        run: npm run lint

      - name: tsc --noEmit
        working-directory: web
        run: npm run typecheck

      - name: vitest
        working-directory: web
        run: npm test -- --run

      - name: Install Playwright's chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke test
        working-directory: web
        run: npm run e2e
