[project]
name = "owlsperch-server"
version = "0.1.0"
description = "FastAPI server for the owlsperch D&D 3.5e reference site"
requires-python = ">=3.12"
dependencies = [
    "owlsperch",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
owlsperch-server = "owlsperch_server.app:main"

[tool.uv.sources]
owlsperch = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["owlsperch_server"]

# All tool configuration ([tool.pytest.ini_options], [tool.ruff], [tool.mypy])
# lives in the root pyproject.toml, not here -- see the comment there. This
# file is the package definition only.
[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]
